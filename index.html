<title>Wizard Scoresheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (max 560px), phone-first. Home list -> setup -> game with Round / Scores tabs. */
:root {
  --bg: #f1f0f7;
  --surface: #ffffff;
  --ink: #1d1a38;
  --muted: #6a6786;
  --line: #dedcec;
  --accent: #5a3fd0;
  --accent-ink: #ffffff;
  --gold: #a97800;
  --good: #1f8a52;
  --bad: #c43d4b;
  --font-display: "Cinzel", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122a; --surface: #1f1c3d; --ink: #ecebfa; --muted: #9c99c0; --line: #35315e;
    --accent: #8f7bff; --accent-ink: #14122a; --gold: #e3b341; --good: #4cc98a; --bad: #ff7a87;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122a; --surface: #1f1c3d; --ink: #ecebfa; --muted: #9c99c0; --line: #35315e;
  --accent: #8f7bff; --accent-ink: #14122a; --gold: #e3b341; --good: #4cc98a; --bad: #ff7a87;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.top h1 { font-size: 1.35rem; flex: 1; min-width: 0; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 44px; height: 44px; font-size: 1.2rem; flex: none; }

.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 0 20px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* home */
.game-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.game-item .info { flex: 1; min-width: 0; }
.game-item .names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pill { font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
.pill.live { color: var(--accent); border-color: var(--accent); }
.pill.done { color: var(--gold); border-color: var(--gold); }
details.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
details.rules summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
details.rules ul { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* setup */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 48px; padding: 0 14px; width: 100%; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* game */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tabs button { min-height: 44px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }
.roundnav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.roundnav .mid { flex: 1; text-align: center; }
.roundnav h2 { font-size: 1.25rem; }
.roundnav button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.2rem; flex: none; }
.roundnav button:disabled { opacity: .3; }
.prow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; }
.prow .who { min-width: 0; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dealer { font-size: .7rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
.colhead { display: grid; grid-template-columns: 1fr 128px 128px; gap: 12px; padding-inline: 14px; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.colhead span { text-align: center; }
.step { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; width: 128px; }
.step button { height: 44px; border: 1px solid var(--line); background: var(--bg); font-size: 1.25rem; font-weight: 600; }
.step button:first-child { border-radius: 10px 0 0 10px; }
.step button:last-child { border-radius: 0 10px 10px 0; }
.step output { text-align: center; font-weight: 700; font-size: 1.15rem; height: 44px; line-height: 44px; border-block: 1px solid var(--line); }
.step output.unset { color: var(--muted); }
.delta { grid-column: 1 / -1; font-size: .85rem; font-weight: 600; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
.status { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .9rem; margin-top: 12px; }
.status .ok { color: var(--good); font-weight: 600; } .status .warn { color: var(--bad); font-weight: 600; }
.banner { background: var(--surface); border: 2px solid var(--gold); border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 16px; }
.banner h2 { color: var(--gold); font-size: 1.3rem; }

/* scores */
.board { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.rank { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rank.first { border-color: var(--gold); }
.rank .pos { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.rank.first .pos { color: var(--gold); }
.rank .tot { font-size: 1.4rem; font-weight: 700; }
.rank b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); min-width: 72px; }
th { font-size: .75rem; font-weight: 600; color: var(--muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--surface); min-width: 52px; border-right: 1px solid var(--line); font-weight: 600; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tr.tap { cursor: pointer; }
td .cum { font-weight: 700; display: block; }
td .sub { font-size: .7rem; color: var(--muted); display: block; white-space: nowrap; }
td .sub.good { color: var(--good); } td .sub.bad { color: var(--bad); }
.danger-zone { margin-top: 28px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>

<div id="app"></div>

<script>
(function () {
  /* Supabase project settings (the anon key is meant to be public). */
  var SB_URL = 'https://qmkcjerizgizpulljdmj.supabase.co';
  var SB_KEY = 'sb_publishable_XhiSVNvZh5u6OoTh--uvzg_ShSCbkrh';

  var KEY = 'wizard-sheets-v1', CODE_KEY = 'wizard-sync-code';
  var games = [];
  var memOnly = false;
  try { games = JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { games = []; memOnly = true; }
  games.forEach(function (g) { if (!g.updated) g.updated = g.created; });
  var code = '';
  try { code = localStorage.getItem(CODE_KEY) || ''; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(games)); } catch (e) { memOnly = true; } }
  function touch(g) { g.updated = Date.now(); save(); scheduleSync(); }
  function visible() { return games.filter(function (g) { return !g.deleted; }); }

  var ui = { view: 'home', id: null, round: 0, tab: 'round', count: 4, names: ['', '', '', ''], confirmDel: false, sync: code ? 'idle' : 'off', msg: '' };
  var app = document.getElementById('app');

  /* Sync: each game is one row under the shared code. Newest edit of a game wins. */
  var configured = !!(SB_URL && SB_KEY), busy = false, again = false, timer = null;
  function rpc(name, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }
  function scheduleSync() { if (!code || !configured) return; clearTimeout(timer); timer = setTimeout(sync, 700); }
  function sync() {
    if (!code || !configured) return;
    if (busy) { again = true; return; }
    busy = true; ui.sync = 'syncing';
    if (ui.view === 'home') render();
    rpc('get_sheets', { p_code: code }).then(function (rows) {
      var remote = {}, changed = false;
      (rows || []).forEach(function (row) {
        remote[row.id] = row;
        var i = -1;
        games.forEach(function (g, k) { if (g.id === row.id) i = k; });
        if (i < 0) { games.push(row.data); changed = true; }
        else if (row.data.updated > games[i].updated) { games[i] = row.data; changed = true; }
      });
      var pushes = games.filter(function (g) { return !remote[g.id] || remote[g.id].updated_at < g.updated; })
        .map(function (g) { return rpc('put_sheet', { p_code: code, p_id: g.id, p_data: g, p_updated: g.updated, p_deleted: !!g.deleted }); });
      return Promise.all(pushes).then(function () { return changed; });
    }).then(function (changed) {
      save(); ui.sync = 'ok'; ui.msg = '';
      if (changed && (ui.view === 'home' || ui.view === 'game')) render(); else if (ui.view === 'home' || ui.view === 'sync') render();
    }).catch(function () {
      ui.sync = 'error';
      if (ui.view === 'home' || ui.view === 'sync') render();
    }).then(function () { busy = false; if (again) { again = false; scheduleSync(); } });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  setInterval(function () { if (!document.hidden && ui.view !== 'setup') sync(); }, 20000);

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function cur() { return visible().filter(function (g) { return g.id === ui.id; })[0]; }
  function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }

  /* Rules: 60-card deck, rounds = 60 / players; round n deals n cards.
     Exact bid: 20 + 10 per trick. Miss: -10 per trick of difference. */
  function roundScore(bid, won) { return bid === won ? 20 + 10 * won : -10 * Math.abs(bid - won); }
  function isComplete(g, r) {
    var d = g.rounds[r], sum = 0;
    for (var i = 0; i < g.players.length; i++) {
      if (d.bids[i] == null || d.tricks[i] == null) return false;
      sum += d.tricks[i];
    }
    return sum === r + 1;
  }
  function totals(g) {
    var t = g.players.map(function () { return 0; });
    var cum = [];
    for (var r = 0; r < g.rounds.length; r++) {
      var row = null;
      if (isComplete(g, r)) {
        for (var i = 0; i < t.length; i++) t[i] += roundScore(g.rounds[r].bids[i], g.rounds[r].tricks[i]);
        row = t.slice();
      }
      cum.push(row);
    }
    return { total: t, cum: cum };
  }
  function doneCount(g) { var n = 0; for (var r = 0; r < g.rounds.length; r++) if (isComplete(g, r)) n++; return n; }
  function finished(g) { return doneCount(g) === g.rounds.length; }
  function winners(g) {
    var t = totals(g).total, max = Math.max.apply(null, t);
    return { names: g.players.filter(function (p, i) { return t[i] === max; }), score: max };
  }
  function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }

  function render() {
    if (ui.view === 'home') app.innerHTML = homeView();
    else if (ui.view === 'setup') app.innerHTML = setupView();
    else if (ui.view === 'sync') app.innerHTML = syncView();
    else app.innerHTML = gameView();
  }

  function homeView() {
    var list = visible().sort(function (a, b) { return b.created - a.created; });
    var label = ui.sync === 'syncing' ? 'Syncing…' : ui.sync === 'ok' ? 'Synced' : ui.sync === 'error' ? 'Sync failed, tap to retry' : code ? 'Sync on' : 'Sync across devices';
    var h = '<div class="top"><h1>Wizard Scoresheet</h1><button class="pill ' + (ui.sync === 'ok' ? 'done' : ui.sync === 'error' ? '' : 'live') + '" style="background:transparent;min-height:36px" data-act="sync-open">' + label + '</button></div><div class="stack">';
    h += '<button class="btn block" data-act="new">New sheet</button>';
    if (!list.length) {
      h += '<div class="empty panel">No games yet. Start a new sheet and it will be saved here for you to review any time.</div>';
    } else {
      h += '<h3 class="muted small" style="letter-spacing:.1em;margin-top:8px">PAST SHEETS</h3>';
      list.forEach(function (g) {
        var fin = finished(g), status;
        if (fin) { var w = winners(g); status = '<span class="pill done">' + esc(w.names.join(' & ')) + ' won · ' + w.score + '</span>'; }
        else status = '<span class="pill live">Round ' + Math.min(doneCount(g) + 1, g.rounds.length) + ' of ' + g.rounds.length + '</span>';
        h += '<button class="game-item" data-act="open" data-id="' + g.id + '"><div class="info"><div class="names">' + esc(g.players.join(', ')) + '</div><div class="muted small">' + fmtDate(g.created) + '</div></div>' + status + '</button>';
      });
    }
    h += '<details class="rules"><summary>Scoring rules</summary><ul>' +
      '<li>60-card deck. 3, 4, 5, 6 players play 20, 15, 12, 10 rounds.</li>' +
      '<li>Round 1 deals 1 card each, round 2 deals 2, and so on. The dealer rotates left each round.</li>' +
      '<li>Every player bids how many tricks they will win.</li>' +
      '<li><b>Exact bid:</b> 20 points plus 10 for each trick won.</li>' +
      '<li><b>Missed bid:</b> lose 10 points for each trick over or under.</li>' +
      '<li>Highest total after the last round wins.</li></ul></details>';
    if (memOnly) h += '<p class="muted small">Saving is blocked in this browser, so sheets will be lost when you close the page.</p>';
    return h + '</div>';
  }

  function syncView() {
    var h = '<div class="top"><button class="back" data-act="home" aria-label="Back">‹</button><h1>Sync</h1></div><div class="stack panel">';
    if (!configured) {
      h += '<p style="margin:0">Cloud sync is not set up in this copy of the app yet.</p>';
    } else {
      h += '<p class="muted small" style="margin:0">Enter the same sync code on every phone and laptop. Anyone with the code can see and edit these games, so keep it private.</p>' +
        '<div class="field"><label for="code">Sync code</label><input type="text" id="code" value="' + esc(code) + '" placeholder="At least 8 characters" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
        '<div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="gen">Make a code</button><button data-act="code-save" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Save and sync</button></div>';
      if (ui.msg) h += '<p class="small" style="margin:0;color:var(--bad)">' + esc(ui.msg) + '</p>';
      else if (ui.sync === 'ok') h += '<p class="small" style="margin:0;color:var(--good)">Synced. Games on this device match the cloud.</p>';
      else if (ui.sync === 'error') h += '<p class="small" style="margin:0;color:var(--bad)">Could not reach the cloud. Check your connection and try again.</p>';
      if (code) h += '<button class="btn ghost" data-act="code-off">Stop syncing on this device</button>';
    }
    h += '<hr style="border:0;border-top:1px solid var(--line);width:100%;margin:4px 0"><div class="field"><label>Backup file</label></div>' +
      '<div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="export">Export</button><button data-act="import">Import</button></div>' +
      '<input type="file" id="imp" accept="application/json,.json" hidden></div>';
    return h;
  }

  function setupView() {
    var rounds = 60 / ui.count;
    var h = '<div class="top"><button class="back" data-act="home" aria-label="Back">‹</button><h1>New sheet</h1></div><div class="stack panel">';
    h += '<div class="field"><label>Players</label><div class="seg">';
    [3, 4, 5, 6].forEach(function (n) { h += '<button data-act="count" data-n="' + n + '" aria-pressed="' + (ui.count === n) + '">' + n + '</button>'; });
    h += '</div><span class="muted small">' + rounds + ' rounds. First name entered deals round 1.</span></div>';
    for (var i = 0; i < ui.count; i++) {
      h += '<div class="field"><label for="p' + i + '">Player ' + (i + 1) + '</label><input type="text" id="p' + i + '" data-name="' + i + '" value="' + esc(ui.names[i] || '') + '" placeholder="Player ' + (i + 1) + '" maxlength="20" autocomplete="off"></div>';
    }
    h += '<button class="btn block" data-act="start">Start game</button></div>';
    return h;
  }

  function stepper(kind, i, val, max) {
    return '<div class="step"><button data-act="' + kind + '-" data-i="' + i + '" aria-label="Decrease ' + kind + '">−</button>' +
      '<output class="num' + (val == null ? ' unset' : '') + '">' + (val == null ? '–' : val) + '</output>' +
      '<button data-act="' + kind + '+" data-i="' + i + '" aria-label="Increase ' + kind + '">+</button></div>';
  }

  function gameView() {
    var g = cur();
    if (!g) { ui.view = 'home'; return homeView(); }
    var fin = finished(g);
    var h = '<div class="top"><button class="back" data-act="home" aria-label="Back to sheets">‹</button><h1>' + fmtDate(g.created) + '</h1></div>';
    if (fin) {
      var w = winners(g);
      h += '<div class="banner"><div class="muted small">GAME COMPLETE</div><h2>' + esc(w.names.join(' & ')) + ' won with ' + w.score + '</h2></div>';
    }
    h += '<div class="tabs" role="tablist"><button role="tab" data-act="tab" data-t="round" aria-selected="' + (ui.tab === 'round') + '">Round</button><button role="tab" data-act="tab" data-t="scores" aria-selected="' + (ui.tab === 'scores') + '">Scores</button></div>';
    h += ui.tab === 'round' ? roundTab(g) : scoresTab(g);
    h += '<div class="danger-zone">';
    if (ui.confirmDel) h += '<span class="small">Delete this sheet for good?</span><button class="btn danger" data-act="del-yes">Delete</button><button class="btn ghost" data-act="del-no">Keep</button>';
    else h += '<button class="btn ghost" data-act="del">Delete sheet</button>';
    return h + '</div>';
  }

  function roundTab(g) {
    var r = ui.round, n = r + 1, d = g.rounds[r], P = g.players.length;
    var dealer = g.players[r % P];
    var h = '<div class="roundnav"><button data-act="prev" aria-label="Previous round"' + (r === 0 ? ' disabled' : '') + '>‹</button>' +
      '<div class="mid"><h2>Round ' + n + ' <span class="muted" style="font-size:.9rem">of ' + g.rounds.length + '</span></h2><div class="muted small">' + n + (n === 1 ? ' card' : ' cards') + ' each · Dealer: ' + esc(dealer) + '</div></div>' +
      '<button data-act="next" aria-label="Next round"' + (r === g.rounds.length - 1 ? ' disabled' : '') + '>›</button></div>';
    h += '<div class="stack"><div class="colhead"><div></div><span>Bid</span><span>Won</span></div>';
    var bidSum = 0, trickSum = 0, allTricks = true, allBids = true;
    g.players.forEach(function (p, i) {
      var b = d.bids[i], t = d.tricks[i];
      if (b == null) allBids = false; else bidSum += b;
      if (t == null) allTricks = false; else trickSum += t;
      h += '<div class="prow"><div class="who"><b>' + esc(p) + '</b>' + (i === r % P ? '<span class="dealer">Dealer</span>' : '') + '</div>' +
        stepper('bid', i, b, n) + stepper('won', i, t, n);
      if (b != null && t != null) {
        var s = roundScore(b, t);
        h += '<div class="delta num ' + (b === t ? 'good' : 'bad') + '">' + (b === t ? 'Made it' : 'Missed by ' + Math.abs(b - t)) + ' · ' + signed(s) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    var bidNote = !allBids ? 'Bids: enter all' : bidSum === n ? 'Bids total ' + bidSum + ' (even)' : bidSum > n ? 'Bids total ' + bidSum + ' (over by ' + (bidSum - n) + ')' : 'Bids total ' + bidSum + ' (under by ' + (n - bidSum) + ')';
    var trickNote = trickSum === n && allTricks ? '<span class="ok">Tricks add up to ' + n + '</span>' : '<span class="' + (allTricks || trickSum > n ? 'warn' : 'muted') + '">Tricks won: ' + trickSum + ' of ' + n + '</span>';
    h += '<div class="status num"><span class="muted">' + bidNote + '</span>' + trickNote + '</div>';
    if (isComplete(g, r) && r < g.rounds.length - 1) h += '<button class="btn block" style="margin-top:16px" data-act="next">Next round</button>';
    if (isComplete(g, r) && r === g.rounds.length - 1 && !finished(g)) h += '';
    return h;
  }

  function scoresTab(g) {
    var T = totals(g), idx = g.players.map(function (p, i) { return i; });
    idx.sort(function (a, b) { return T.total[b] - T.total[a]; });
    var started = doneCount(g) > 0, h = '<div class="board">';
    var topScore = T.total[idx[0]], pos = 0, prev = null;
    idx.forEach(function (i, k) {
      if (T.total[i] !== prev) { pos = k + 1; prev = T.total[i]; }
      h += '<div class="rank num' + (started && T.total[i] === topScore ? ' first' : '') + '"><span class="pos">' + pos + '</span><b>' + esc(g.players[i]) + '</b><span class="tot">' + T.total[i] + '</span></div>';
    });
    h += '</div><div class="tablewrap"><table class="num"><thead><tr><th>Rd</th>';
    g.players.forEach(function (p) { h += '<th>' + esc(p) + '</th>'; });
    h += '</tr></thead><tbody>';
    g.rounds.forEach(function (d, r) {
      h += '<tr class="tap" data-act="goto" data-r="' + r + '"><td>' + (r + 1) + '</td>';
      g.players.forEach(function (p, i) {
        if (T.cum[r]) {
          var s = roundScore(d.bids[i], d.tricks[i]);
          h += '<td><span class="cum">' + T.cum[r][i] + '</span><span class="sub ' + (s >= 0 ? 'good' : 'bad') + '">' + d.bids[i] + '/' + d.tricks[i] + ' ' + signed(s) + '</span></td>';
        } else h += '<td class="muted">·</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div><p class="muted small">Each cell shows the running total, then bid/won and the round points. Tap a row to edit that round.</p>';
  }

  /* events */
  app.addEventListener('input', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-name');
    if (i != null) ui.names[+i] = e.target.value;
  });
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), g = cur();
    if (act === 'new') { ui.view = 'setup'; }
    else if (act === 'home') { ui.view = 'home'; ui.confirmDel = false; }
    else if (act === 'count') { ui.count = +el.getAttribute('data-n'); }
    else if (act === 'start') {
      var players = [], seen = {};
      for (var i = 0; i < ui.count; i++) {
        var nm = (ui.names[i] || '').trim() || 'Player ' + (i + 1);
        if (seen[nm.toLowerCase()]) nm += ' ' + (i + 1);
        seen[nm.toLowerCase()] = 1; players.push(nm);
      }
      var rounds = [];
      for (var r = 0; r < 60 / ui.count; r++) rounds.push({ bids: players.map(function () { return null; }), tricks: players.map(function () { return null; }) });
      var ng = { id: uid(), created: Date.now(), players: players, rounds: rounds };
      ng.updated = ng.created; games.push(ng); touch(ng);
      ui.view = 'game'; ui.id = ng.id; ui.round = 0; ui.tab = 'round'; ui.confirmDel = false;
    }
    else if (act === 'open') {
      var og = games.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      ui.view = 'game'; ui.id = og.id; ui.confirmDel = false;
      ui.round = Math.min(doneCount(og), og.rounds.length - 1);
      ui.tab = finished(og) ? 'scores' : 'round';
    }
    else if (act === 'tab') { ui.tab = el.getAttribute('data-t'); }
    else if (act === 'prev') { ui.round = Math.max(0, ui.round - 1); window.scrollTo(0, 0); }
    else if (act === 'next') { ui.round = Math.min(g.rounds.length - 1, ui.round + 1); window.scrollTo(0, 0); }
    else if (act === 'goto') { ui.round = +el.getAttribute('data-r'); ui.tab = 'round'; window.scrollTo(0, 0); }
    else if (act === 'del') { ui.confirmDel = true; }
    else if (act === 'del-no') { ui.confirmDel = false; }
    else if (act === 'del-yes') { g.deleted = true; touch(g); ui.view = 'home'; ui.confirmDel = false; }
    else if (act === 'sync-open') { ui.view = 'sync'; ui.msg = ''; if (code) sync(); }
    else if (act === 'gen') {
      var abc = 'abcdefghjkmnpqrstuvwxyz23456789', s = '', rnd = new Uint8Array(12);
      (window.crypto || window.msCrypto).getRandomValues(rnd);
      for (var k = 0; k < 12; k++) s += abc[rnd[k] % abc.length];
      code = s; ui.msg = '';
    }
    else if (act === 'code-save') {
      var v = (document.getElementById('code').value || '').trim().toLowerCase();
      if (v.length < 8) { ui.msg = 'Use at least 8 characters.'; }
      else {
        code = v; ui.msg = ''; ui.sync = 'idle';
        try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
        sync();
      }
    }
    else if (act === 'code-off') { code = ''; ui.sync = 'off'; try { localStorage.removeItem(CODE_KEY); } catch (e) {} }
    else if (act === 'export') {
      var blob = new Blob([JSON.stringify(visible(), null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'wizard-sheets.json';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    else if (act === 'import') { document.getElementById('imp').click(); return; }
    else {
      var m = act.match(/^(bid|won)([+-])$/);
      if (m && g) {
        var arr = m[1] === 'bid' ? g.rounds[ui.round].bids : g.rounds[ui.round].tricks;
        var i2 = +el.getAttribute('data-i'), max = ui.round + 1, v = arr[i2];
        if (m[2] === '+') arr[i2] = v == null ? 0 : Math.min(max, v + 1);
        else arr[i2] = v == null ? 0 : Math.max(0, v - 1);
        touch(g);
      }
    }
    render();
  });
  app.addEventListener('change', function (e) {
    if (e.target.id !== 'imp' || !e.target.files[0]) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var arr = JSON.parse(rd.result), n = 0;
        arr.forEach(function (g) {
          if (!g || !g.id || !g.players || !g.rounds) return;
          var have = games.filter(function (x) { return x.id === g.id; })[0];
          if (!have) { g.updated = g.updated || Date.now(); g.deleted = false; games.push(g); n++; }
        });
        save(); scheduleSync();
        ui.view = 'home'; render();
      } catch (err) { ui.msg = 'That file is not a Wizard backup.'; render(); }
    };
    rd.readAsText(e.target.files[0]);
  });

  render();
  sync();
})();
</script>
